# Gradle and Android build properties for Kayumars
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# rust-android-gradle 0.9.4 invokes project.exec at task execution time,
# which is incompatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
