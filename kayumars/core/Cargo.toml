[package]
name = "kayumars_core"
version = "0.1.0"
edition = "2021"
authors = ["Kayumars Systems Team"]
description = "Ultra-low-latency Android launcher core engine in Rust"
license = "Apache-2.0"

[lib]
name = "kayumars_core"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
uniffi = { version = "0.28.3", default-features = false }
nucleo = "0.2"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
unicode-normalization = "0.1"
parking_lot = "0.12"
arc-swap = "1.7"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.14"

[[bench]]
name = "search_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
